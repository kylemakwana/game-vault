[project]
name = "game-vault"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "psnawp>=3.0.3",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
]

[project.scripts]
game-vault = "game_vault.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]

[tool.pytest.ini_options]
addopts = [
    "--cov=game_vault",
    "--cov-report=term-missing",
]

[tool.coverage.report]
fail_under = 95
show_missing = true
